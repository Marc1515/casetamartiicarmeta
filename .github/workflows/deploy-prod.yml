name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: self-hosted

    steps:
      - name: Deploy production locally
        run: |
          cd ~/apps/casetamartiicarmeta
          git fetch origin
          git checkout main
          git reset --hard origin/main
          docker compose -f docker-compose.prod.yml up -d --build
