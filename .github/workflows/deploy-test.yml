name: Deploy test

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy test branch locally
        run: |
          cd ~/apps/casetamartiicarmeta-test
          git fetch origin
          git checkout dev
          git pull origin dev
          docker compose -f docker-compose.test.yml up -d --build
